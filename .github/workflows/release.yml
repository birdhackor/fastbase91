name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# One release run per tag at a time: a second trigger for the same ref waits
# instead of racing the first, so the two registries can never be won by
# different runs.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-ref:
    name: validate release tag
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require an exact stable release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "release publishing requires a tag ref, got: $GITHUB_REF_TYPE" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match ^v[0-9]+\\.[0-9]+\\.[0-9]+$, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi

  build-test-and-batch:
    name: build, test, and assemble release batch
    needs: validate-release-ref
    uses: ./.github/workflows/python.yml
    permissions:
      contents: read

  verify-release-batch:
    name: verify tagged release batch
    needs: build-test-and-batch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-batch
          path: release-batch
      - name: Verify manifest, hashes, source commit, and tag version
        shell: bash
        run: |
          python .github/scripts/verify-batch.py \
            --manifest release-batch/manifest.json \
            --artifacts release-batch/artifacts \
            --expected-source-commit "$GITHUB_SHA" \
            --expected-version "${GITHUB_REF_NAME#v}"

  publish-pypi:
    name: publish Python distributions to PyPI
    needs: verify-release-batch
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-batch
          path: release-batch
      # Trusted Publishing deliberately omits username/password and requests only
      # an OIDC token in this isolated publish job.
      - uses: pypa/gh-action-pypi-publish@67339c736fd9354cd4f8cb0b744f2b82a74b5c70 # v1.12.3
        with:
          packages-dir: release-batch/artifacts

  publish-crates:
    name: publish fastbase91-core to crates.io
    # Serialized after PyPI (not merely parallel on verify-release-batch) so a
    # re-run whose PyPI upload fails on already-present files cannot still push a
    # freshly rebuilt crate: the crate job is skipped when its upstream fails.
    needs: publish-pypi
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The first crates.io publication uses P11's scoped token. After that
      # publication, P11 can configure crates.io OIDC and replace this path.
      # Do not publish fastbase91-python: its path dependency lacks a core
      # version and therefore remains intentionally unpublished until P11.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Require the core crate version to match the release tag
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json
          import sys

          packages = json.load(sys.stdin)["packages"]
          matches = [package for package in packages if package["name"] == "fastbase91-core"]
          if len(matches) != 1:
              raise SystemExit(f"expected one fastbase91-core package, found {len(matches)}")
          print(matches[0]["version"])
          ')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$core_version" != "$tag_version" ]]; then
            echo "fastbase91-core version $core_version does not match release tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "fastbase91-core version matches release tag: $core_version"
      - name: Publish fastbase91-core to crates.io
        run: cargo publish -p fastbase91-core --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
