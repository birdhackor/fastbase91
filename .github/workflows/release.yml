name: Release

on:
  push:
    tags:
      - "v*"
      - "fastbase91-core-v*"
  workflow_dispatch:

permissions:
  contents: read

# One release run per tag at a time. Registry version guards make a second run
# fail closed if the first run has already published that independently versioned package.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-ref:
    name: validate release tag
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - id: classify
        name: Require and classify an exact stable release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "release publishing requires a tag ref, got: $GITHUB_REF_TYPE" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "kind=python" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" =~ ^fastbase91-core-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "kind=core" >> "$GITHUB_OUTPUT"
          else
            echo "release tag must match ^v[0-9]+\\.[0-9]+\\.[0-9]+$ or ^fastbase91-core-v[0-9]+\\.[0-9]+\\.[0-9]+$, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi

  build-test-and-batch:
    name: build, test, and assemble Python release batch
    needs: validate-release-ref
    if: ${{ needs.validate-release-ref.outputs.kind == 'python' }}
    uses: ./.github/workflows/python.yml
    permissions:
      contents: read

  verify-release-batch:
    name: verify tagged Python release batch
    needs: [validate-release-ref, build-test-and-batch]
    if: ${{ needs.validate-release-ref.outputs.kind == 'python' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-batch
          path: release-batch
      - name: Verify manifest, hashes, source commit, and tag version
        shell: bash
        run: |
          python .github/scripts/verify-batch.py \
            --manifest release-batch/manifest.json \
            --artifacts release-batch/artifacts \
            --expected-source-commit "$GITHUB_SHA" \
            --expected-version "${GITHUB_REF_NAME#v}"

  verify-published-core:
    name: require the wheel's exact core to be published first
    needs: [validate-release-ref, verify-release-batch]
    if: ${{ needs.validate-release-ref.outputs.kind == 'python' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CRATES_HAS_MAX_ATTEMPTS: "12"
      CRATES_HAS_INTERVAL_SECONDS: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Require the exact embedded core version to exist on crates.io
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(python -c 'import tomllib; print(tomllib.load(open("crates/fastbase91-core/Cargo.toml", "rb"))["package"]["version"])')"
          core_tag="fastbase91-core-v${core_version}"

          fail_core_first() {
            echo "core 先發守衛失敗：先發 ${core_tag}，或先升 core 版號再發" >&2
            exit "$1"
          }

          if ! git rev-parse --verify --quiet "refs/tags/${core_tag}^{commit}" >/dev/null; then
            echo "required core tag is missing: ${core_tag}" >&2
            fail_core_first 1
          fi
          if ! git diff --quiet "refs/tags/${core_tag}^{commit}" HEAD -- crates/fastbase91-core; then
            echo "crates/fastbase91-core differs between ${core_tag} and HEAD" >&2
            fail_core_first 1
          fi
          if [[ ! "$CRATES_HAS_MAX_ATTEMPTS" =~ ^[1-9][0-9]*$ ]] ||
             [[ ! "$CRATES_HAS_INTERVAL_SECONDS" =~ ^[0-9]+$ ]]; then
            echo "invalid bounded crates.io polling configuration" >&2
            fail_core_first 2
          fi

          last_status=1
          for ((attempt = 1; attempt <= CRATES_HAS_MAX_ATTEMPTS; attempt++)); do
            if python .github/scripts/registry_state.py \
              crates-has fastbase91-core "$core_version"; then
              echo "published core prerequisite satisfied: ${core_tag}"
              exit 0
            else
              last_status=$?
            fi
            if (( attempt < CRATES_HAS_MAX_ATTEMPTS )); then
              echo "crates.io has not confirmed ${core_tag}; retrying (${attempt}/${CRATES_HAS_MAX_ATTEMPTS})" >&2
              sleep "$CRATES_HAS_INTERVAL_SECONDS"
            fi
          done

          if [[ "$last_status" -eq 2 ]]; then
            echo "crates.io state query remained unavailable after ${CRATES_HAS_MAX_ATTEMPTS} attempts" >&2
            fail_core_first 2
          fi
          echo "crates.io does not contain fastbase91-core ${core_version} after ${CRATES_HAS_MAX_ATTEMPTS} attempts" >&2
          fail_core_first 1

  publish-pypi:
    name: publish Python distributions to PyPI
    needs: [validate-release-ref, verify-release-batch, verify-published-core]
    if: ${{ needs.validate-release-ref.outputs.kind == 'python' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Reject publish job reruns
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "published versions are immutable; start a new complete run from an unpublished version instead of rerunning a publish job" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-batch
          path: release-batch
      - name: Require the Python version to be absent from PyPI
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if python .github/scripts/registry_state.py pypi-has fastbase91 "$version"; then
            echo "PyPI already contains fastbase91 $version; refusing to publish" >&2
            exit 1
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              echo "PyPI state query failed with status $status; refusing to publish" >&2
              exit "$status"
            fi
          fi
      # Trusted Publishing deliberately omits username/password and requests only
      # an OIDC token in this isolated publish job.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release-batch/artifacts
      - name: Verify the published PyPI artifact set after propagation
        shell: bash
        run: |
          python .github/scripts/registry_state.py \
            pypi-set-matches fastbase91 "${GITHUB_REF_NAME#v}" release-batch/manifest.json

  build-test-core:
    name: build and test fastbase91-core
    needs: validate-release-ref
    if: ${{ needs.validate-release-ref.outputs.kind == 'core' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
          targets: thumbv7em-none-eabihf
      # The Python release path builds and tests everything via python.yml; the
      # decoupled core path must gate its own irreversible publish across the same
      # feature matrix rust.yml covers, so a broken no_std/alloc or bare-metal
      # build cannot permanently burn a crates.io version.
      - name: Lint and test the core crate across its feature matrix
        run: |
          set -euo pipefail
          cargo clippy -p fastbase91-core --all-targets --all-features -- -D warnings
          cargo test -p fastbase91-core --no-default-features
          cargo test -p fastbase91-core --no-default-features --features alloc
          cargo test -p fastbase91-core --all-features
          cargo check --target thumbv7em-none-eabihf -p fastbase91-core --no-default-features

  build-test-core-msrv:
    name: test fastbase91-core on MSRV 1.81
    needs: validate-release-ref
    if: ${{ needs.validate-release-ref.outputs.kind == 'core' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@9a1e4aa8b738983d2a36f2f839626fe8fdaf1355 # 1.81.0
      - name: Test the core crate on the minimum supported Rust version
        run: |
          set -euo pipefail
          cargo test -p fastbase91-core --no-default-features
          cargo test -p fastbase91-core --no-default-features --features alloc

  publish-crates:
    name: publish fastbase91-core to crates.io
    needs: [validate-release-ref, build-test-core, build-test-core-msrv]
    if: ${{ needs.validate-release-ref.outputs.kind == 'core' }}
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      contents: read
    steps:
      - name: Reject publish job reruns
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "published versions are immutable; start a new complete run from an unpublished version instead of rerunning a publish job" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Require the core crate version to match the core release tag
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json
          import sys

          packages = json.load(sys.stdin)["packages"]
          matches = [package for package in packages if package["name"] == "fastbase91-core"]
          if len(matches) != 1:
              raise SystemExit(f"expected one fastbase91-core package, found {len(matches)}")
          print(matches[0]["version"])
          ')"
          tag_version="${GITHUB_REF_NAME#fastbase91-core-v}"
          if [[ "$core_version" != "$tag_version" ]]; then
            echo "fastbase91-core version $core_version does not match core release tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "fastbase91-core version matches core release tag: $core_version"
      - name: Require the core version to be absent from crates.io
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#fastbase91-core-v}"
          if python .github/scripts/registry_state.py \
            crates-has fastbase91-core "$version"; then
            echo "crates.io already contains fastbase91-core $version; refusing to publish" >&2
            exit 1
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              echo "crates.io state query failed with status $status; refusing to publish" >&2
              exit "$status"
            fi
          fi
      - name: Publish fastbase91-core to crates.io
        run: cargo publish -p fastbase91-core --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
