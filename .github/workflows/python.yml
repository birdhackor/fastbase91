name: Python wheels

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  wheel-matrix:
    name: load wheel policy matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: load
        name: Load the checked-in wheel matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python3 -c 'import json; print(json.dumps(json.load(open(".github/wheel-matrix.json", encoding="utf-8")), separators=(",", ":")))')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-wheels:
    name: ${{ matrix.id }}
    needs: wheel-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.wheel-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: matrix.python_provider == 'uv'
        with:
          version: "0.12.17"
          enable-cache: false
      - id: uv_python
        name: Install the uv-managed build interpreter
        if: matrix.python_provider == 'uv'
        shell: bash
        run: |
          set -euo pipefail
          uv python install "${{ matrix.build_python_version }}"
          python_path="$(uv python find --no-project "${{ matrix.build_python_version }}")"
          if [[ "${{ matrix.free_threaded }}" == "true" ]]; then
            "$python_path" -c 'import sys; assert not sys._is_gil_enabled(); print(sys.version)'
          else
            "$python_path" -c 'import sys; print(sys.version)'
          fi
          echo "path=$python_path" >> "$GITHUB_OUTPUT"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          rust-toolchain: stable
          manylinux: ${{ matrix.manylinux }}
          args: >-
            --release --locked --compatibility pypi
            --manifest-path bindings/python/Cargo.toml --out dist
            -i "${{ matrix.python_provider == 'uv' && steps.uv_python.outputs.path || matrix.interpreter }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.id }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          command: sdist
          args: --manifest-path bindings/python/Cargo.toml --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  sdist-build-test:
    name: build and smoke-test unpacked source distribution
    needs: build-sdist
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdist
          path: sdist
      - name: Build from unpacked sdist and test the resulting wheel
        shell: bash
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          shopt -s nullglob
          sdists=(sdist/*.tar.gz)
          if (( ${#sdists[@]} != 1 )); then
            echo "expected exactly one sdist artifact, found ${#sdists[@]}" >&2
            exit 1
          fi
          mkdir "$work_dir/unpacked"
          tar -xzf "${sdists[0]}" -C "$work_dir/unpacked"
          source_dirs=("$work_dir"/unpacked/*)
          if (( ${#source_dirs[@]} != 1 )) || [[ ! -d "${source_dirs[0]}" ]]; then
            echo "sdist must unpack to exactly one source directory" >&2
            exit 1
          fi
          python -m venv "$work_dir/build-venv"
          "$work_dir/build-venv/bin/python" -m pip install --upgrade pip "maturin==1.15.0"
          mkdir "$work_dir/wheels"
          (
            cd "${source_dirs[0]}"
            "$work_dir/build-venv/bin/maturin" build --release --locked --out "$work_dir/wheels"
          )
          python -m venv "$work_dir/test-venv"
          "$work_dir/test-venv/bin/python" -m pip install --force-reinstall "$work_dir"/wheels/*.whl
          "$work_dir/test-venv/bin/python" - <<'PY'
          import fastbase91

          payload = bytes(range(256))
          assert fastbase91.decode(fastbase91.encode(payload)) == payload
          print("unpacked sdist build and round-trip smoke test: ok")
          PY

  manifest:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheels-*
          path: artifacts
          merge-multiple: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdist
          path: artifacts/sdist
      - run: >-
          python .github/scripts/gen-manifest.py
          --artifacts artifacts
          --matrix .github/wheel-matrix.json
          --output manifest.json
          --package fastbase91
          --source-commit "${{ github.sha }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manifest
          path: manifest.json
          if-no-files-found: error

  test-wheels:
    name: test ${{ matrix.id }} on Python ${{ matrix.test_python_version }}
    needs: [wheel-matrix, build-wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The abi3 wheel is exercised on both its ABI floor and a newer regular
      # CPython. The same checked-in matrix drives builds and install tests.
      matrix: ${{ fromJSON(needs.wheel-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Regular released interpreters come from setup-python; free-threaded
      # ones (including the 3.15 RC) are only reliably available via uv, so the
      # test interpreter is chosen by free_threaded, independent of how the
      # wheel was built.
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: ${{ !matrix.free_threaded }}
        with:
          python-version: ${{ matrix.test_python_version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: matrix.free_threaded
        with:
          version: "0.12.17"
          enable-cache: false
      - id: uv_test_python
        name: Create an isolated uv-managed free-threaded test environment
        if: matrix.free_threaded
        shell: bash
        run: |
          set -euo pipefail
          uv python install "${{ matrix.test_python_version }}"
          venv_dir="$RUNNER_TEMP/fastbase91-wheel-test"
          uv venv --seed --python "${{ matrix.test_python_version }}" "$venv_dir"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_path="$venv_dir/Scripts/python.exe"
          else
            python_path="$venv_dir/bin/python"
          fi
          "$python_path" -c 'import sys; assert not sys._is_gil_enabled(); print(sys.version)'
          echo "path=$python_path" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheels-${{ matrix.id }}
          path: wheel
      - name: Install the built wheel and test dependencies
        shell: bash
        env:
          TEST_PYTHON: ${{ matrix.free_threaded && steps.uv_test_python.outputs.path || 'python' }}
        run: |
          "$TEST_PYTHON" -m pip install --upgrade pip pytest
          "$TEST_PYTHON" -m pip install --force-reinstall wheel/*.whl
      - name: Import smoke test
        shell: bash
        env:
          TEST_PYTHON: ${{ matrix.free_threaded && steps.uv_test_python.outputs.path || 'python' }}
        run: |
          "$TEST_PYTHON" -c "import fastbase91; assert fastbase91.encode(b'input') == b'xojg][A'; print('python import: ok')"
      - name: Free-threaded build gate
        if: matrix.free_threaded
        shell: bash
        env:
          TEST_PYTHON: ${{ matrix.free_threaded && steps.uv_test_python.outputs.path || 'python' }}
        run: |
          "$TEST_PYTHON" - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import sys

          if not hasattr(sys, "_is_gil_enabled"):
              raise RuntimeError("this gate requires a free-threaded CPython runtime")

          import fastbase91

          if sys._is_gil_enabled():
              raise AssertionError("importing fastbase91 re-enabled the GIL")

          payloads = [
              bytes((seed + offset) % 256 for offset in range(4096 + seed))
              for seed in range(32)
          ]
          with ThreadPoolExecutor(max_workers=8) as executor:
              results = list(
                  executor.map(lambda payload: fastbase91.decode(fastbase91.encode(payload)), payloads)
              )
          for index, (payload, result) in enumerate(zip(payloads, results, strict=True)):
              if result != payload:
                  raise AssertionError(f"payload {index} changed during concurrent round-trip")
          print("free-threaded gate: GIL remains disabled and all payload bytes round-trip")
          PY
      - name: Run binding tests
        shell: bash
        env:
          TEST_PYTHON: ${{ matrix.free_threaded && steps.uv_test_python.outputs.path || 'python' }}
        run: '"$TEST_PYTHON" -m pytest bindings/python/tests -q'

  license-copies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - run: python .github/scripts/check-license-copies.py

  link-python-input-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Assert PyBytes borrows while bytearray owns
        shell: bash
        run: |
          # Derive the linker name from the interpreter version + abiflags
          # (e.g. python3.14, python3.14t). LDLIBRARY is unreliable here: on a
          # macOS framework build it is a framework path, not libpythonX.Y.dylib.
          python_libdir="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          python_link_name="$(python -c 'import sys; print(f"python{sys.version_info.major}.{sys.version_info.minor}{sys.abiflags}")')"
          test -n "$python_libdir"
          test -n "$python_link_name"
          RUSTFLAGS="--cfg fastbase91_link_python -L native=$python_libdir -l dylib=$python_link_name" \
            cargo test -p fastbase91-python --lib

  verify-batch:
    name: verify release batch
    needs: [manifest, sdist-build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheels-*
          path: release-input/artifacts
          merge-multiple: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdist
          path: release-input/artifacts/sdist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: manifest
          path: release-input
      - run: >-
          python .github/scripts/verify-batch.py
          --manifest release-input/manifest.json
          --artifacts release-input/artifacts
          --expected-source-commit "${{ github.sha }}"
      - name: Assemble the verified flat release batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-batch/artifacts
          cp release-input/manifest.json release-batch/manifest.json
          find release-input/artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' \) \
            -exec cp {} release-batch/artifacts/ \;
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-batch
          path: release-batch
          if-no-files-found: error

  python-ci:
    name: python-ci
    # Stable aggregate status check for branch protection. The matrix job names
    # (${{ matrix.id }}, test ${{ matrix.id }} …) change whenever the wheel
    # matrix changes, so required checks target this fixed name instead of the
    # individual matrix legs. Fails if any upstream job did not succeed.
    needs:
      - wheel-matrix
      - build-wheels
      - build-sdist
      - sdist-build-test
      - manifest
      - test-wheels
      - license-copies
      - link-python-input-test
      - verify-batch
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert every required job succeeded
        shell: bash
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream results: $results"
          for result in $results; do
            if [[ "$result" != "success" ]]; then
              echo "a required upstream job concluded '$result'" >&2
              exit 1
            fi
          done
          echo "all required upstream jobs succeeded"
