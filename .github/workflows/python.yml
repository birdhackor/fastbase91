name: Python

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  maturin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install "maturin>=1.15,<2.0"
      - run: maturin build --release --out dist
        working-directory: bindings/python
      - run: python -m pip install --force-reinstall bindings/python/dist/*.whl
      - run: python -c "import fastbase91; assert fastbase91.encode(b'input') == b'xojg][A'; print('python import: ok')"
