name: Weekly canary

on:
  schedule:
    # Wednesday 04:23 UTC avoids the top-of-hour queue and tests new CPython.
    - cron: "23 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-wheel-on-newest-python:
    name: run published wheel on newest CPython (beta or later)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - id: pick-python
        name: Pick the newest beta-or-later CPython for this runner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . /etc/os-release
          manifest="$RUNNER_TEMP/versions-manifest.json"
          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github.raw+json" \
            --output "$manifest" \
            "https://api.github.com/repos/actions/python-versions/contents/versions-manifest.json?ref=main"
          version="$(python3 .github/scripts/pick-canary-python.py \
            --manifest "$manifest" --os-version "$VERSION_ID" --arch "${RUNNER_ARCH,,}")"
          echo "picked CPython $version for Ubuntu $VERSION_ID ${RUNNER_ARCH,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.pick-python.outputs.version }}
      - name: Install a published wheel and smoke test it
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: --pre --upgrade fastbase91
          python -c "import fastbase91; assert fastbase91.decode(fastbase91.encode(b'canary')) == b'canary'; print('published wheel: ok')"

  rebuild-with-updated-dependencies:
    name: rebuild and run after dependency updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Same Python version the release builds the abi3-py311 wheels with,
          # so Python is not among the things that change between runs. Move it
          # together with that abi3 floor.
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Update locked dependencies and build a wheel
        shell: bash
        run: |
          cargo update
          python -m pip install --upgrade pip "maturin>=1.15,<2.0" pytest
          maturin build --release --locked --compatibility pypi \
            --manifest-path bindings/python/Cargo.toml --out dist -i python
      - name: Install the rebuilt wheel and run the binding suite
        shell: bash
        run: |
          python -m pip install --force-reinstall --only-binary=:all: dist/*.whl
          python -m pytest bindings/python/tests -q

  ping-dead-mans-switch:
    name: ping dead-man's switch
    needs: [published-wheel-on-newest-python, rebuild-with-updated-dependencies]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Ping configured endpoint after both canaries pass
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        shell: bash
        run: |
          : "${HEALTHCHECKS_PING_URL:?P11 must configure HEALTHCHECKS_PING_URL}"
          curl --fail --silent --show-error --retry 3 --max-time 20 \
            --output /dev/null --request POST "$HEALTHCHECKS_PING_URL"
