name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test -p fastbase91-core --no-default-features
      - run: cargo test -p fastbase91-core --no-default-features --features alloc
      - run: cargo test --all-features
      - run: cargo check --target thumbv7em-none-eabihf -p fastbase91-core --no-default-features

  core-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@9a1e4aa8b738983d2a36f2f839626fe8fdaf1355 # 1.81.0
      - run: cargo test -p fastbase91-core --no-default-features
      - run: cargo test -p fastbase91-core --no-default-features --features alloc

  rust-ci:
    name: rust-ci
    # Stable aggregate status check for branch protection, mirroring python-ci.
    needs:
      - stable
      - core-msrv
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert every required job succeeded
        shell: bash
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream results: $results"
          for result in $results; do
            if [[ "$result" != "success" ]]; then
              echo "a required upstream job concluded '$result'" >&2
              exit 1
            fi
          done
          echo "all required upstream jobs succeeded"
