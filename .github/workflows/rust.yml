name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test -p fastbase91-core --no-default-features
      - run: cargo test -p fastbase91-core --no-default-features --features alloc
      - run: cargo test --all-features
      - run: cargo check --target thumbv7em-none-eabihf -p fastbase91-core --no-default-features

  core-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.81.0
      - run: cargo test -p fastbase91-core --no-default-features
      - run: cargo test -p fastbase91-core --no-default-features --features alloc
