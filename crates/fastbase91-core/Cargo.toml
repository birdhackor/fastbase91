[package]
name = "fastbase91-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
description = "Safe no_std core for fastbase91"
include = ["src/**", "benches/**", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["std"]
alloc = []
std = ["alloc"]

[[bench]]
name = "throughput"
harness = false
