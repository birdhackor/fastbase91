[package]
name = "fastbase91-python"
version = "0.1.1"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
description = "PyO3 bindings for fastbase91"
build = "build.rs"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_fastbase91"
crate-type = ["cdylib"]

[features]
bench_no_detach = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fastbase91_link_python)'] }

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py311", "abi3t-py315"] }
fastbase91-core = { path = "../../crates/fastbase91-core" }
