[project]
site_name = "fastbase91"
site_url = "https://birdhackor.github.io/fastbase91/en/"
repo_url = "https://github.com/birdhackor/fastbase91"
repo_name = "birdhackor/fastbase91"
docs_dir = "docs/en"
site_dir = "site/en"
nav = [
  { "Overview" = "index.md" },
  { "Usage" = "usage.md" },
  { "Free-threading" = "free-threading.md" },
  { "Comparison" = "comparison.md" },
  { "Benchmarks" = "benchmarks.md" },
]

[project.theme]
language = "en"
features = [
  "navigation.sections",
  "navigation.top",
  "content.code.copy",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.extra]
alternate = [
  { name = "English", link = "/fastbase91/en/", lang = "en" },
  { name = "繁體中文", link = "/fastbase91/zh-Hant/", lang = "zh-Hant" },
]

[project.markdown_extensions]
admonition = {}
pymdownx.superfences = {}
pymdownx.highlight = { anchor_linenums = true }
